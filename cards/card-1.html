ton" class="download" data-download="4">Скачать PNG</button></div></div></section><div class="status" role="status" aria-live="polite"></div></main><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Увеличенный просмотр карточки" aria-hidden="true"><button type="button" class="close" id="close">Закрыть ×</button><div class="large"></div></div><script>
const svgNodes=Array.from(document.querySelectorAll('.canvas svg'));
const statusEl=document.querySelector('.status');
let busy=false;
async function renderPng(index){
  const source=svgNodes[index];
  const clone=source.cloneNode(true);
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  clone.setAttribute('width','2400');clone.setAttribute('height','1800');
  const sourceText=new XMLSerializer().serializeToString(clone);
  const blob=new Blob([sourceText],{type:'image/svg+xml;charset=utf-8'});
  const blobUrl=URL.createObjectURL(blob);
  try{
    const img=new Image();
    await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('Не удалось отрисовать SVG'));img.src=blobUrl;});
    const canvas=document.createElement('canvas');canvas.width=2400;canvas.height=1800;
    const ctx=canvas.getContext('2d',{alpha:false});if(!ctx)throw new Error('Canvas недоступен');
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,2400,1800);
    const png=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Ошибка экспорта')), 'image/png'));
    return png;
  }finally{URL.revokeObjectURL(blobUrl);}
}
async function saveImage(index){
  if(busy)return;
  busy=true;
  const btn=document.querySelector(`[data-download="${index}"]`);
  const oldText=btn.textContent;
  btn.textContent='Подготовка PNG…';btn.disabled=true;statusEl.textContent='Экспорт изображения 2400 × 1800…';
  try{
    const png=await renderPng(index);const url=URL.createObjectURL(png);
    const a=document.createElement('a');a.href=url;a.download=`avito-manicure-${String(index+1).padStart(2,'0')}.png`;
    document.body.appendChild(a);a.click();a.remove();
    statusEl.textContent=`Изображение ${index+1} подготовлено.`;
    setTimeout(()=>URL.revokeObjectURL(url),5000);
  }catch(e){statusEl.textContent=`Ошибка: ${e.message}`;console.error(e)}
  finally{btn.textContent=oldText;btn.disabled=false;busy=false;}
}
const overlay=document.getElementById('overlay');const large=overlay.querySelector('.large');
function preview(index){large.replaceChildren(svgNodes[index].cloneNode(true));overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';document.getElementById('close').focus();}
function closePreview(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');large.replaceChildren();document.body.style.overflow='';}
for(const btn of document.querySelectorAll('[data-download]'))btn.addEventListener('click',()=>saveImage(Number(btn.dataset.download)));
for(const btn of document.querySelectorAll('[data-preview]'))btn.addEventListener('click',()=>preview(Number(btn.dataset.preview)));
document.getElementById('close').addEventListener('click',closePreview);
overlay.addEventListener('click',e=>{if(e.target===overlay)closePreview()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))closePreview()});
window.__renderPng=renderPng;
</script></body></html>
