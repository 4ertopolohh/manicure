<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Четыре баннера</title>
<style>
@font-face{font-family:Golos;src:url('../frontend/public/fonts/golos.ttf')}@font-face{font-family:Cormorant;src:url('../frontend/public/fonts/cormorant.ttf')}
*{box-sizing:border-box}body{margin:0;background:#f4f0e9;color:#302b2b;font-family:Golos,Arial,sans-serif}.showcase{width:min(1240px,calc(100% - 32px));margin:auto;padding:36px 0 80px}.showcase__head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}.showcase__head h1{font:500 clamp(30px,4vw,48px)/1 Cormorant,Georgia,serif;margin:0}.language{display:flex;gap:4px;padding:4px;border:1px solid #dfd2cc;border-radius:12px;background:#fffaf6}.language button{border:0;border-radius:8px;padding:9px 13px;background:transparent;color:#665b57;font:600 14px Golos,sans-serif;cursor:pointer}.language button[aria-pressed=true]{background:#752e43;color:white}.language button:focus-visible{outline:2px solid #752e43;outline-offset:3px}.banners{display:grid;gap:24px}.banner{--ink:#302b2b;position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,42%);align-items:center;min-height:344px;padding:36px clamp(28px,5.3vw,68px) 86px;border-radius:24px;background:#f2e7e3;color:var(--ink)}.banner__copy{position:relative;z-index:2;max-width:620px}.banner h2{font:600 clamp(44px,5.6vw,76px)/.95 Cormorant,Georgia,serif;letter-spacing:-.025em;margin:0 0 18px;text-wrap:balance}.banner p{font-size:clamp(16px,1.65vw,20px);line-height:1.45;max-width:470px;margin:0;text-wrap:balance}.banner__art{position:relative;align-self:stretch;min-height:190px}.banner__art svg{position:absolute;width:100%;height:calc(100% + 75px);top:0;right:0;overflow:visible}.banner--triad{background:#e7edee}.banner--triad h2{color:#3f6374}.banner--photo{background:#eee4df}.banner--photo h2{color:#752e43}.banner--tools{background:#752e43;--ink:#fff8f3}.banner--food{background:#f4e9dc}.banner--food h2{color:#b35d34}
@media(max-width:700px){.showcase{width:calc(100% - 24px);padding-top:24px}.showcase__head{margin-bottom:22px}.banners{gap:16px}.banner{display:flex;flex-direction:column;align-items:stretch;min-height:350px;text-align:center;padding:26px 22px 70px;border-radius:20px}.banner__copy{max-width:none}.banner h2{font-size:clamp(40px,10vw,58px);margin-bottom:10px}.banner p{font-size:15px;line-height:1.35;margin:auto}.banner__art{flex:1;min-height:125px;margin-top:6px}.banner__art svg{height:calc(100% + 48px);top:0;right:0}.banner--tools h2{font-size:clamp(38px,9.5vw,55px)}}
</style>
</head><body><main class="showcase"><header class="showcase__head"><h1 data-ru="Четыре баннера" data-en="Four banners">Четыре баннера</h1><div class="language" role="group" aria-label="Язык / Language"><button type="button" data-language="ru" aria-pressed="true">RU</button><button type="button" data-language="en" aria-pressed="false">EN</button></div></header><div class="banners">
<article class="banner banner--triad"><div class="banner__copy"><h2 data-ru="Триад Студио" data-en="Triad Studio">Триад Студио</h2><p data-ru="Нужен сайт? Доработки? Дизайн? Триад Студио — ваш помощник" data-en="Need a website, updates or design? Triad Studio is here to help.">Нужен сайт? Доработки? Дизайн? Триад Студио — ваш помощник</p></div><div class="banner__art" aria-hidden="true"><svg viewBox="0 0 440 230" preserveAspectRatio="xMidYMid meet"><circle cx="236" cy="115" r="112" fill="#cbdcde"/><circle cx="236" cy="115" r="80" fill="none" stroke="#aabfc4" stroke-width="1"/><rect x="80" y="39" width="250" height="150" rx="15" fill="#fcfaf6" stroke="#b9ccce" stroke-width="2" transform="rotate(-6 205 114)"/><path d="M105 75h115M105 89h78" stroke="#c7d6d6" stroke-width="7" stroke-linecap="round"/><rect x="105" y="115" width="83" height="35" rx="9" fill="#4c7583"/><circle cx="266" cy="112" r="39" fill="#cbdcde"/><path d="M249 112h34m-17-17v34" stroke="#668995" stroke-width="3"/><circle cx="340" cy="42" r="22" fill="#9ab7bd"/><circle cx="75" cy="180" r="15" fill="#d4e2e1"/></svg></div></article>
<article class="banner banner--photo"><div class="banner__copy"><h2 data-ru="Фото-редактор" data-en="Photo Editor">Фото-редактор</h2><p data-ru="Удобный, полностью бесплатный инструмент" data-en="A convenient, completely free tool">Удобный, полностью бесплатный инструмент</p></div><div class="banner__art" aria-hidden="true"><svg viewBox="0 0 440 230" preserveAspectRatio="xMidYMid meet"><circle cx="230" cy="113" r="109" fill="#e3cfc9"/><g transform="rotate(5 225 115)"><rect x="92" y="28" width="260" height="180" rx="15" fill="#fffaf6" stroke="#d7c5bd" stroke-width="2"/><rect x="110" y="48" width="176" height="140" rx="8" fill="#d9b8b1"/><circle cx="240" cy="86" r="19" fill="#f5e9df"/><path d="M110 167l49-49 32 29 27-24 68 65H110z" fill="#ad8180"/><path d="M309 64h24m-24 24h24m-24 24h24m-24 24h24" stroke="#cdb7ae" stroke-width="5" stroke-linecap="round"/><circle cx="318" cy="64" r="5" fill="#752e43"/><circle cx="326" cy="88" r="5" fill="#752e43"/><circle cx="316" cy="112" r="5" fill="#752e43"/></g></svg></div></article>
<article class="banner banner--tools"><div class="banner__copy"><h2 data-ru="Надёжные инструменты" data-en="Reliable Tools">Надёжные инструменты</h2><p data-ru="Большой выбор инструментов под любые нужды" data-en="A wide selection of tools for different needs">Большой выбор инструментов под любые нужды</p></div><div class="banner__art" aria-hidden="true"><svg viewBox="0 0 440 230" preserveAspectRatio="xMidYMid meet"><circle cx="230" cy="115" r="108" fill="#8c4356"/><circle cx="230" cy="115" r="78" fill="none" stroke="#b77782" stroke-width="2"/><g transform="rotate(-38 230 115)"><rect x="208" y="72" width="44" height="135" rx="20" fill="#f1d8cf"/><path d="M198 57a38 38 0 0 1 24-35v29l9 8 9-8V22a38 38 0 0 1 19 58h-56a38 38 0 0 1-5-23z" fill="#f1d8cf"/><circle cx="230" cy="185" r="6" fill="#a45e6d"/></g><circle cx="320" cy="51" r="24" fill="none" stroke="#dbaeb0" stroke-width="8"/><circle cx="130" cy="180" r="12" fill="#c7858e"/></svg></div></article>
<article class="banner banner--food"><div class="banner__copy"><h2>Minus 12</h2><p data-ru="Как начать худеть в понедельник" data-en="How to start losing weight on Monday">Как начать худеть в понедельник</p></div><div class="banner__art" aria-hidden="true"><svg viewBox="0 0 440 230" preserveAspectRatio="xMidYMid meet"><circle cx="230" cy="115" r="110" fill="#ead6c0"/><circle cx="230" cy="115" r="83" fill="#fffaf3" stroke="#dfcbbb" stroke-width="5"/><circle cx="230" cy="115" r="65" fill="#f2e8da"/><path d="M213 128c-30-4-49-30-45-53 30 2 52 21 45 53z" fill="#8a9a70"/><path d="M214 129c17-31 46-40 67-26-10 26-36 40-67 26z" fill="#a8b486"/><circle cx="260" cy="130" r="25" fill="#d78258"/><circle cx="260" cy="130" r="17" fill="#edaf83"/><path d="M248 130h24m-12-12v24" stroke="#f5d4ae" stroke-width="2"/><circle cx="199" cy="146" r="17" fill="#c56f50"/><circle cx="200" cy="146" r="11" fill="#e7a187"/><path d="M289 55c9-14 22-19 33-17-2 13-13 24-28 25" fill="#8a9a70"/><circle cx="316" cy="169" r="13" fill="#d9a47a"/></svg></div></article>
</div></main><script>
document.querySelectorAll('[data-language]').forEach(button=>button.addEventListener('click',()=>{const language=button.dataset.language;document.documentElement.lang=language;document.querySelectorAll('[data-ru][data-en]').forEach(element=>{element.textContent=element.dataset[language]});document.querySelectorAll('[data-language]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)))}));
</script></body></html>
